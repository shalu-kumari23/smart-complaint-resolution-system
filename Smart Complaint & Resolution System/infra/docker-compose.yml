version: "3.8"

services:
  mongo:
    image: mongo:latest
    container_name: resolveai_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ../
      dockerfile: backend/Dockerfile
    container_name: resolveai_backend
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URL=mongodb://mongo:27017/
      - MONGO_DB_NAME=smart_complaint_resolution
      - SECRET_KEY=yoursecretkeyhereforsafejwtencryptionshouldbelongandcomplex
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
    depends_on:
      - mongo

  frontend:
    build:
      context: ../
      dockerfile: frontend/Dockerfile
    container_name: resolveai_frontend
    ports:
      - "8501:8501"
    environment:
      - API_BASE=http://backend:8000
    depends_on:
      - backend

volumes:
  mongo_data:
